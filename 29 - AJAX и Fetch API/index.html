<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AJAX и Fetch API</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <form class="form-card" id="userData">
        <input id="userId" type="number" placeholder="user's id" />
        <input id="title" type="text" placeholder="header" />
        <input id="body" type="text" placeholder="text" />
        <button id="button" type="submit">Submit</button>
        <button id="update-btn" type="submit">Update data</button>
      </form>
      <div id="server-response"></div>
      <button id="show-list-btn" type="button">Show posts</button>
      <div id="posts-list"></div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
